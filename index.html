<style>
:root{
  --noir:#000;--fond:#050505;--charbon:#0C0C0D;
  --terre:#241A12;--terre2:#150F0A;--bronze:#8C6A44;
  --gris:#6A7075;--argent:#B9C0C6;--clair:#D9DEE3;--vif:#F4F7F9;--phos:#79F0A8;
  --ligne:rgba(255,255,255,.10);--ligne2:rgba(255,255,255,.22);
  --dis:"Big Shoulders Display","Arial Narrow",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
/* acier : métal froid, accent glacier — l'opposé du cuivre */
[data-theme="acier"]{
  --noir:#04070A;--fond:#06090D;--charbon:#0A0E13;
  --terre:#121A21;--terre2:#080C10;--bronze:#6F8695;
  --gris:#66727C;--argent:#AFBAC3;--clair:#D4DDE4;--vif:#EEF5FA;--phos:#7FD8F5;
  --ligne:rgba(190,220,240,.11);--ligne2:rgba(190,220,240,.24);
}
[data-theme="acier"] .bandes{background:repeating-linear-gradient(118deg,
  rgba(200,230,250,.035) 0 2px,transparent 2px 15px,rgba(111,134,149,.14) 15px 46px,transparent 46px 74px)}
[data-theme="acier"] .halo{background:radial-gradient(circle,rgba(127,216,245,.13),transparent 62%)}
[data-theme="acier"] .halo.b{background:radial-gradient(circle,rgba(111,134,149,.20),transparent 64%)}
[data-theme="acier"] .tab.ici::after{box-shadow:0 0 16px var(--phos)}
[data-theme="acier"] .cle:hover{box-shadow:0 0 26px rgba(127,216,245,.45)}
[data-theme="acier"] .nom{text-shadow:0 0 46px rgba(190,225,245,.18)}
[data-theme="acier"] .indice{background:linear-gradient(100deg,rgba(127,216,245,.08),transparent 72%)}
[data-theme="acier"] .dispo{border-color:rgba(127,216,245,.4)}

/* ───────── clair : blanc, noir, rien d'autre ─────────
   négatif exact du thème sombre. Aucune teinte : la hiérarchie passe
   par la masse, le filet et l'inversion, jamais par la couleur. */
[data-theme="clair"]{
  --noir:#FFFFFF;--fond:#FFFFFF;--charbon:#F4F4F4;
  --terre:#EDEDED;--terre2:#F8F8F8;--bronze:#A0A0A0;
  --gris:#767676;--argent:#3A3A3A;--clair:#161616;--vif:#000000;--phos:#000000;
  --ligne:rgba(0,0,0,.14);--ligne2:rgba(0,0,0,.30);
  --encre:#000000;--papier:#FFFFFF;
}
[data-theme="clair"] #grain{mix-blend-mode:multiply;opacity:.10}
[data-theme="clair"] .bandes{background:repeating-linear-gradient(118deg,
  rgba(0,0,0,.05) 0 2px,transparent 2px 15px,rgba(0,0,0,.035) 15px 46px,transparent 46px 74px)}
[data-theme="clair"] .trame{background-image:radial-gradient(rgba(0,0,0,.20) 1px,transparent 1.5px);
  background-size:6px 6px;opacity:.4}
[data-theme="clair"] .halo,[data-theme="clair"] .halo.b{display:none}

[data-theme="clair"] .haut{background:rgba(255,255,255,.94);border-bottom:1px solid var(--encre)}
[data-theme="clair"] .marque{color:var(--encre)}
[data-theme="clair"] .marque span{color:var(--gris)}
[data-theme="clair"] .sigle i{background:var(--encre);box-shadow:none}
[data-theme="clair"] .mini{border-color:var(--ligne2);color:var(--argent)}
[data-theme="clair"] .mini:hover,[data-theme="clair"] .mini.actif{background:var(--encre);color:var(--papier);border-color:var(--encre)}

/* colonne noire, onglet actif en bloc blanc */
[data-theme="clair"] .menu{background:var(--encre);border-right:0}
[data-theme="clair"] .tab{background:#000;color:#9A9A9A;box-shadow:inset 0 0 0 1px #1E1E1E}
[data-theme="clair"] .tab .idx{color:#5E5E5E}
[data-theme="clair"] .tab:hover{background:#151515;color:#FFF;box-shadow:inset 0 0 0 1px #3A3A3A}
[data-theme="clair"] .tab.ici{background:#FFF;color:#000;box-shadow:none}
[data-theme="clair"] .tab.ici .idx{color:#8A8A8A}
[data-theme="clair"] .tab.ici::after{background:#FFF;box-shadow:none}
@media (max-width:820px){[data-theme="clair"] .menu{border-bottom:0}}

/* cartes blanches cernées d'un filet, inversion totale au survol */
[data-theme="clair"] .carte{background:var(--papier);box-shadow:inset 0 0 0 1px var(--ligne2)}
[data-theme="clair"] .carte:hover{background:#000;box-shadow:none}
[data-theme="clair"] .carte:hover h3{color:#FFF}
[data-theme="clair"] .carte:hover p{color:#9A9A9A}
[data-theme="clair"] .carte:hover .n{-webkit-text-stroke-color:#6E6E6E}
[data-theme="clair"] .carte:hover .tag,[data-theme="clair"] .carte:hover .ouvre{color:#FFF}
[data-theme="clair"] .carte:hover .pastille{color:#B4B4B4;border-color:rgba(255,255,255,.3)}
[data-theme="clair"] .carte:hover .pastille.demo{color:#FFF;border-color:rgba(255,255,255,.6)}
[data-theme="clair"] .carte .tag{color:var(--encre)}
[data-theme="clair"] .carte .pastille.demo{color:var(--encre);border-color:var(--ligne2)}

[data-theme="clair"] .item{background:linear-gradient(100deg,var(--terre),transparent 74%);
  border-left:3px solid var(--encre)}
[data-theme="clair"] .item:hover{background:linear-gradient(100deg,#E4E4E4,transparent 74%)}
[data-theme="clair"] .item .date{color:var(--gris)}
[data-theme="clair"] .item .role{color:var(--encre)}
[data-theme="clair"] .lien{background:var(--papier);border-color:var(--ligne2)}
[data-theme="clair"] .lien:hover{background:#000;color:#FFF;border-color:#000}
[data-theme="clair"] .lien:hover span{color:#9A9A9A}
[data-theme="clair"] .indice{background:var(--terre2);border-left:3px solid var(--encre);color:var(--argent)}
[data-theme="clair"] .indice span:first-child{color:var(--encre)}

[data-theme="clair"] .cle{background:#000;color:#FFF}
[data-theme="clair"] .cle:hover{background:#FFF;color:#000;box-shadow:inset 0 0 0 1.5px #000}
[data-theme="clair"] .cle.creuse{background:transparent;color:#000;box-shadow:inset 0 0 0 1.5px var(--ligne2)}
[data-theme="clair"] .cle.creuse:hover{background:#000;color:#FFF;box-shadow:none}

[data-theme="clair"] .calque{background:rgba(255,255,255,.88)}
[data-theme="clair"] .fiche{background:#FFF;border:1px solid var(--encre);
  box-shadow:0 40px 80px -40px rgba(0,0,0,.45)}
[data-theme="clair"] .fiche .tag{color:var(--encre)}
[data-theme="clair"] .fiche .n{-webkit-text-stroke-color:var(--bronze)}
[data-theme="clair"] .dispo{border-color:var(--ligne2);color:var(--encre)}
[data-theme="clair"] .dispo i{background:var(--encre);box-shadow:none}
[data-theme="clair"] .nom,[data-theme="clair"] .titre,[data-theme="clair"] .question{text-shadow:none}
[data-theme="clair"] .nom .creux{-webkit-text-stroke:1.8px var(--encre);color:transparent}
[data-theme="clair"] .nom .barre{background:var(--encre);box-shadow:none}
[data-theme="clair"] .titre em{-webkit-text-stroke:1.5px var(--bronze)}
[data-theme="clair"] .sous::after{background:var(--ligne2)}
[data-theme="clair"] .puces i{border-color:var(--ligne2)}
[data-theme="clair"] kbd{background:#F4F4F4;border-color:var(--ligne2);color:var(--argent)}
[data-theme="clair"] .transi i{background:#000}
[data-theme="clair"] .transi i:nth-child(even){background:#2E2E2E}
[data-theme="clair"] .transi i:nth-child(4){background:#7A7A7A}
[data-theme="clair"] .scene{scrollbar-color:var(--ligne2) transparent}
[data-theme="clair"] .scene::-webkit-scrollbar-thumb{background:var(--ligne2)}

*{box-sizing:border-box}
html{height:100%;scroll-behavior:smooth}
body{margin:0;height:100dvh;min-height:100%;overflow:hidden;background:var(--noir);color:var(--clair);
  font-family:var(--mono);font-size:14.5px;line-height:1.62;-webkit-font-smoothing:antialiased}

#grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.33;mix-blend-mode:screen}
.bandes{position:fixed;inset:-20%;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(118deg,rgba(255,255,255,.030) 0 2px,transparent 2px 15px,
    rgba(140,106,68,.10) 15px 46px,transparent 46px 74px);animation:derive 34s linear infinite}
@keyframes derive{to{transform:translate3d(-74px,140px,0)}}
.trame{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px);background-size:5px 5px;
  mask-image:linear-gradient(160deg,#000 0%,transparent 48%)}
.halo{position:fixed;z-index:0;pointer-events:none;left:-10vw;bottom:-30vh;width:75vw;height:75vh;border-radius:50%;
  background:radial-gradient(circle,rgba(121,240,168,.10),transparent 62%);filter:blur(30px)}
.halo.b{left:auto;right:-16vw;top:-26vh;bottom:auto;width:60vw;height:60vh;
  background:radial-gradient(circle,rgba(140,106,68,.16),transparent 64%)}

.app{position:relative;z-index:2;height:100dvh;display:flex;flex-direction:column}
.haut{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px clamp(14px,3.4vw,40px);
  border-bottom:1px solid var(--ligne);background:linear-gradient(180deg,rgba(0,0,0,.85),transparent)}
.marque{font-family:var(--dis);font-weight:900;font-size:21px;letter-spacing:.06em;color:var(--vif);line-height:1}
.marque span{color:var(--phos)}
.etat{font-size:11.5px;color:var(--gris);letter-spacing:.12em}
.outils{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.outils{margin-left:0;width:100%;gap:6px}.outils .mini{padding:5px 8px}}
.mini{font-family:var(--mono);font-size:11px;color:var(--argent);letter-spacing:.1em;background:transparent;
  text-decoration:none;display:inline-flex;align-items:center;
  border:1px solid var(--ligne);padding:5px 11px;cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.mini:hover{color:var(--noir);background:var(--vif);border-color:var(--vif)}
.mini.actif{color:var(--noir);background:var(--phos);border-color:var(--phos)}

.corps{flex:1;min-height:0;display:grid;grid-template-columns:clamp(178px,20vw,250px) 1fr}
@media (max-width:820px){.corps{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

.menu{padding:clamp(14px,3vw,34px) 0 24px clamp(10px,2vw,22px);display:flex;flex-direction:column;gap:9px;
  align-items:flex-start;border-right:1px solid var(--ligne);overflow:auto;scrollbar-width:none}
.menu::-webkit-scrollbar{display:none}
@media (max-width:820px){.menu{flex-direction:row;border-right:0;border-bottom:1px solid var(--ligne);
  padding:10px clamp(10px,3vw,20px);gap:7px}}
.tab{position:relative;width:100%;min-width:132px;font-family:var(--dis);font-weight:700;
  font-size:clamp(19px,2.3vw,27px);letter-spacing:.045em;text-transform:uppercase;line-height:1;
  color:var(--argent);background:linear-gradient(100deg,var(--terre2),#0A0A0B);border:0;padding:13px 16px 12px;
  cursor:pointer;text-align:left;clip-path:polygon(0 6%,100% 0,97% 100%,2% 94%);transform:skewX(-7deg);
  transition:color .16s,background .16s,transform .16s}
.tab .idx{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--gris);letter-spacing:.14em;
  display:block;margin-bottom:3px}
.tab:hover{color:var(--vif);background:linear-gradient(100deg,var(--terre),#12100E);transform:skewX(-7deg) translateX(5px)}
.tab:hover,.tab.ici{animation:gigote .55s steps(1) infinite}
.tab.ici{color:var(--noir);background:linear-gradient(100deg,var(--vif),#9AA2A8);transform:skewX(-7deg) translateX(9px)}
.tab.ici .idx{color:#3C4145}
.tab.ici::after{content:"";position:absolute;left:-10px;top:50%;translate:0 -50%;width:5px;height:62%;
  background:var(--phos);box-shadow:0 0 14px var(--phos);clip-path:polygon(0 8%,100% 0,100% 100%,0 92%)}
@keyframes gigote{
  0%{clip-path:polygon(0 6%,100% 0,97% 100%,2% 94%)}
  25%{clip-path:polygon(1% 3%,99% 2%,100% 97%,0 100%)}
  50%{clip-path:polygon(0 0,98% 4%,97% 96%,1% 100%)}
  75%{clip-path:polygon(2% 4%,100% 1%,98% 100%,0 95%)}}

.scene{position:relative;min-height:0;overflow-y:auto;scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.16) transparent;padding:clamp(20px,4vw,52px) clamp(16px,4.4vw,64px) 64px}
.scene::-webkit-scrollbar{width:8px}
.scene::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
.vue{display:none}
.vue.ici{display:block;animation:pousse .42s cubic-bezier(.16,.9,.2,1)}
@keyframes pousse{from{opacity:0;transform:translateY(16px) skewY(.6deg)}}

.titre{font-family:var(--dis);font-weight:900;text-transform:uppercase;line-height:.84;
  font-size:clamp(44px,8.6vw,104px);letter-spacing:-.015em;color:var(--vif);margin:0 0 6px;transform:skewX(-5deg)}
.titre em{font-style:normal;color:transparent;-webkit-text-stroke:1.4px var(--argent)}
.sous{font-size:12px;color:var(--gris);letter-spacing:.22em;margin:0 0 26px;display:flex;align-items:center;gap:12px}
.sous::after{content:"";flex:1;height:1px;background:var(--ligne)}
.txt{max-width:62ch;color:var(--argent);margin:0 0 16px}
.txt b{color:var(--vif);font-weight:400}

.hero{display:grid;gap:clamp(18px,3vw,40px);align-content:center;min-height:calc(100dvh - 230px)}
.nom{font-family:var(--dis);font-weight:900;text-transform:uppercase;font-size:clamp(50px,11.4vw,150px);
  line-height:.78;letter-spacing:-.022em;margin:0;color:var(--vif);transform:skewX(-6deg);
  text-shadow:0 0 46px rgba(255,255,255,.14)}
.nom .creux{color:transparent;-webkit-text-stroke:1.6px var(--vif);text-shadow:none;display:block}
.nom .barre{display:inline-block;width:.36em;height:.10em;background:var(--phos);
  box-shadow:0 0 22px var(--phos);translate:0 -.22em}
.pitch{max-width:58ch;color:var(--argent);font-size:15px}
.pitch strong{color:var(--vif);font-weight:400}
.dispo{display:inline-flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.16em;color:var(--phos);
  border:1px solid rgba(121,240,168,.35);padding:5px 12px;width:max-content}
.dispo i{width:6px;height:6px;border-radius:50%;background:var(--phos);box-shadow:0 0 10px var(--phos);
  animation:pouls 2.6s ease-in-out infinite}
@keyframes pouls{50%{opacity:.25}}
.rapide{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cle{font-family:var(--dis);font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--noir);background:var(--vif);border:0;padding:12px 22px 10px;cursor:pointer;text-decoration:none;
  display:inline-block;clip-path:polygon(0 8%,100% 0,98% 100%,2% 92%);transform:skewX(-7deg);
  transition:background .16s,box-shadow .16s}
.cle:hover{background:var(--phos);box-shadow:0 0 26px rgba(121,240,168,.45)}
.cle.creuse{background:transparent;color:var(--vif);box-shadow:inset 0 0 0 1px var(--ligne2)}
.cle.creuse:hover{color:var(--noir);background:var(--vif);box-shadow:none}

.grille{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(255px,1fr))}
.carte{position:relative;text-align:left;cursor:pointer;color:inherit;
  background:linear-gradient(150deg,var(--terre2),#08080A 62%);border:0;padding:20px 20px 18px;
  clip-path:polygon(0 4%,100% 0,99% 100%,1% 96%);transition:transform .18s,background .18s}
.carte:hover{background:linear-gradient(150deg,var(--terre),#0D0C0B 62%);transform:translateY(-3px);
  animation:gigote .5s steps(1) infinite}
.carte .n{font-family:var(--dis);font-weight:900;font-size:34px;line-height:1;color:transparent;
  -webkit-text-stroke:1px var(--bronze)}
.carte h3{font-family:var(--dis);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:25px;
  line-height:1;margin:8px 0 7px;color:var(--vif)}
.carte p{margin:0;font-size:13px;color:var(--gris);min-height:2.6em}
.carte .tag{position:absolute;top:14px;right:16px;font-size:10px;letter-spacing:.16em;color:var(--phos)}
.carte .bas-carte{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.carte .pastilles{display:flex;gap:6px;flex-wrap:wrap;margin:0}
.carte .pastille{font-size:10px;letter-spacing:.14em;color:var(--argent);border:1px solid var(--ligne);padding:2px 8px}
.carte .pastille.demo{color:var(--phos);border-color:rgba(121,240,168,.42)}
.carte .ouvre{font-size:10px;letter-spacing:.14em;color:var(--gris);white-space:nowrap;transition:color .16s}
.carte:hover .ouvre{color:var(--phos)}
.indice{display:flex;gap:11px;align-items:flex-start;max-width:70ch;margin:-10px 0 24px;padding:11px 15px;
  border-left:2px solid var(--phos);background:linear-gradient(100deg,rgba(121,240,168,.07),transparent 72%);
  font-size:12.5px;color:var(--argent)}
.indice span:first-child{color:var(--phos)}
.filtres{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.filtres .mini span{opacity:.6;margin-left:6px}
.selection{margin:0 0 14px;font-size:12px;letter-spacing:.12em;color:var(--gris)}
.plus{display:flex;justify-content:center;margin:26px 0 8px}
.carte:focus-visible{outline:1px solid var(--phos);outline-offset:3px}

.pile{display:grid;gap:10px}
.item{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start;padding:15px 18px;
  background:linear-gradient(100deg,rgba(36,26,18,.5),transparent 70%);border-left:2px solid var(--ligne2)}
.item:hover{border-left-color:var(--phos)}
.item .date{font-size:11.5px;color:var(--bronze);letter-spacing:.1em;padding-top:3px}
.item h3{font-family:var(--dis);font-weight:700;text-transform:uppercase;font-size:22px;letter-spacing:.03em;
  margin:0 0 2px;color:var(--vif);line-height:1.05}
.item .role{font-size:11px;letter-spacing:.14em;color:var(--phos);margin-bottom:6px}
.item p{margin:0;font-size:13px;color:var(--gris);max-width:62ch}
@media (max-width:620px){.item{grid-template-columns:1fr;gap:4px}}

.puces{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.puces i{font-style:normal;font-size:11px;letter-spacing:.1em;color:var(--argent);border:1px solid var(--ligne);
  padding:3px 9px}

.liens{display:grid;gap:8px;max-width:600px}
.lien{display:flex;align-items:center;gap:14px;padding:14px 18px;text-decoration:none;color:var(--clair);
  background:linear-gradient(100deg,var(--terre2),transparent 80%);border:1px solid var(--ligne);
  transition:background .16s,border-color .16s,transform .16s}
.lien:hover{background:linear-gradient(100deg,var(--terre),transparent 80%);border-color:var(--phos);transform:translateX(5px)}
.lien b{font-family:var(--dis);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;min-width:118px}
.lien span{font-size:12.5px;color:var(--gris)}

.calque{position:fixed;inset:0;z-index:70;display:none;place-items:center;padding:clamp(12px,4vw,48px);
  background:rgba(0,0,0,.84);backdrop-filter:blur(8px)}
.calque.on{display:grid;animation:pousse .3s ease}
.fiche{position:relative;width:min(700px,100%);max-height:100%;overflow-y:auto;scrollbar-width:none;
  background:linear-gradient(155deg,#14100C,#000 65%);border:1px solid var(--ligne2);
  padding:clamp(24px,4.5vw,44px);clip-path:polygon(0 2%,100% 0,99.4% 100%,.6% 98%)}
.fiche::-webkit-scrollbar{display:none}
.fiche .n{font-family:var(--dis);font-weight:900;font-size:52px;line-height:.9;color:transparent;
  -webkit-text-stroke:1.2px var(--bronze)}
.fiche h2{font-family:var(--dis);font-weight:900;text-transform:uppercase;font-size:clamp(34px,6vw,56px);
  line-height:.9;letter-spacing:-.01em;margin:6px 0 14px;color:var(--vif);transform:skewX(-4deg)}
.fiche .tag{font-size:11px;letter-spacing:.18em;color:var(--phos)}
.fiche p{color:var(--argent);max-width:58ch}

.transi{position:fixed;inset:-14% -6%;z-index:80;pointer-events:none;display:grid;grid-template-rows:repeat(7,1fr);
  transform:skewY(-5deg)}
.transi i{background:var(--vif);transform:scaleX(0);transform-origin:left}
.transi i:nth-child(even){background:var(--argent);transform-origin:right}
.transi i:nth-child(4){background:var(--phos)}
.transi.joue i{animation:balayer .62s cubic-bezier(.7,0,.25,1) forwards}
.transi.joue i:nth-child(2){animation-delay:.035s}
.transi.joue i:nth-child(3){animation-delay:.07s}
.transi.joue i:nth-child(4){animation-delay:.105s}
.transi.joue i:nth-child(5){animation-delay:.07s}
.transi.joue i:nth-child(6){animation-delay:.035s}
@keyframes balayer{0%{transform:scaleX(0)}45%{transform:scaleX(1)}55%{transform:scaleX(1)}
  100%{transform:scaleX(0);transform-origin:right}}
.transi.joue i:nth-child(even){animation-name:balayer2}
@keyframes balayer2{0%{transform:scaleX(0)}45%{transform:scaleX(1)}55%{transform:scaleX(1)}
  100%{transform:scaleX(0);transform-origin:left}}

.bas{padding:10px clamp(14px,3.4vw,40px);border-top:1px solid var(--ligne);display:flex;gap:16px;flex-wrap:wrap;
  font-size:11px;color:var(--gris);letter-spacing:.1em}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--argent);border:1px solid var(--ligne2);padding:1px 6px;background:#0A0A0B}
@media (max-width:820px){.bas{display:none}}
:focus-visible{outline:1px solid var(--phos);outline-offset:2px}
html.sobre *{animation-duration:.01ms !important;animation-iteration-count:1 !important;
  transition-duration:.01ms !important}
html.sobre .bandes,html.sobre .dispo i{animation:none}

/* ───────── impression ───────── */
@media print{
  #grain,.bandes,.trame,.halo,.transi,.menu,.bas,.outils,.calque,.rapide{display:none !important}
  html,body{height:auto;overflow:visible;background:#fff;color:#000}
  .app{height:auto;display:block}
  .corps{display:block}
  .scene{overflow:visible;padding:0}
  .vue{display:block !important;page-break-inside:avoid;margin-bottom:26px}
  .titre,.nom,.carte h3,.item h3{color:#000;text-shadow:none;transform:none}
  .titre em,.nom .creux,.carte .n{-webkit-text-stroke:0;color:#555}
  .carte,.item,.lien{background:none;border:1px solid #bbb;clip-path:none;color:#000}
  .txt,.pitch,.carte p,.item p{color:#222}
  a{color:#000;text-decoration:underline}
}

/* ───────── écran de garde : figure à droite, menu à gauche ───────── */
.garde{position:fixed;inset:0;z-index:40;background:var(--noir);overflow:hidden}
.garde.partie{display:none}
.garde .masse{position:absolute;inset:0;z-index:0;
  background:linear-gradient(103deg,transparent 30%,rgba(36,26,18,.92) 30.3%,rgba(36,26,18,.35) 62%,transparent 86%)}
.garde .biseau{position:absolute;z-index:0;right:-6%;top:-12%;width:66%;height:124%;
  background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 60%);
  clip-path:polygon(22% 0,100% 0,100% 100%,4% 100%);border-left:1px solid var(--ligne)}
#toile{position:absolute;z-index:1;right:-3%;top:0;width:60%;height:100%;display:block;cursor:crosshair}
.garde .voile{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(95deg,var(--noir) 12%,rgba(0,0,0,.72) 34%,transparent 62%)}

.gcontenu{position:relative;z-index:3;height:100%;display:flex;flex-direction:column;justify-content:center;
  gap:clamp(10px,1.8vh,22px);padding:0 clamp(18px,4.6vw,66px);max-width:min(820px,62%)}
.gsur{margin:0;font-size:11px;letter-spacing:.32em;color:var(--gris)}
.gnom{font-family:var(--dis);font-weight:900;text-transform:uppercase;margin:0;line-height:.84;
  font-size:clamp(26px,3.5vw,46px);letter-spacing:-.005em;color:var(--vif);transform:skewX(-7deg)}
.gnom i{font-style:normal;color:var(--phos)}
.gnom b{display:block;color:transparent;-webkit-text-stroke:1.3px var(--argent);font-weight:900}

.gmenu{display:flex;flex-direction:column;gap:clamp(2px,.5vh,7px);margin-top:clamp(6px,1.4vh,18px)}
.gitem{display:flex;align-items:center;gap:clamp(10px,1.4vw,20px);width:max-content;max-width:100%;
  background:transparent;border:0;cursor:pointer;text-align:left;color:var(--argent);
  font-family:var(--dis);font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:.005em;
  font-size:clamp(26px,4.4vw,62px);padding:clamp(2px,.5vh,7px) clamp(14px,1.6vw,26px) clamp(2px,.5vh,7px) 0;
  transform:skewX(-9deg);transition:color .15s,background .15s,padding .15s}
.gitem .carre{width:clamp(10px,1vw,16px);height:clamp(10px,1vw,16px);background:var(--ligne2);flex:0 0 auto;
  transition:background .15s,box-shadow .15s}
.gitem .cle{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.2em;color:var(--gris);
  align-self:flex-end;padding-bottom:.6em}
.gitem:hover,.gitem:focus-visible,.gitem.sel{outline:none;color:#07080A;
  background:linear-gradient(100deg,var(--vif),#98A0A6);padding-left:clamp(14px,1.6vw,26px)}
.gitem:hover .carre,.gitem:focus-visible .carre,.gitem.sel .carre{background:var(--phos);box-shadow:0 0 14px var(--phos)}
.gitem:hover .cle,.gitem.sel .cle{color:#3F4448}
.gitem.premier{background:linear-gradient(100deg,var(--terre),#15110C);color:var(--vif)}
.gitem.premier:hover,.gitem.premier.sel{background:linear-gradient(100deg,var(--vif),var(--phos));color:#07080A}

.gleg{margin:clamp(4px,1vh,14px) 0 0;min-height:2.6em;max-width:46ch;font-size:12.5px;color:var(--argent)}
.gbas{display:flex;align-items:flex-end;gap:clamp(16px,2.4vw,34px);margin-top:clamp(6px,1.6vh,22px)}
.gbas .compte{font-family:var(--dis);font-weight:900;font-size:clamp(22px,2.6vw,34px);line-height:1;color:var(--vif)}
.gbas .compte b{font:inherit}
.gbas .compte span{display:block;margin-top:3px;font-family:var(--mono);font-size:10px;font-weight:400;
  letter-spacing:.2em;color:var(--gris)}
.gcoin{position:absolute;z-index:4;top:clamp(14px,2.4vh,26px);right:clamp(16px,3vw,34px);text-align:right;
  font-size:11px;letter-spacing:.2em;color:var(--gris)}
.gcoin b{display:block;font-family:var(--dis);font-weight:700;font-size:20px;letter-spacing:.06em;color:var(--vif)}
.goutils{position:absolute;z-index:4;top:clamp(14px,2.4vh,26px);left:clamp(16px,3vw,34px);display:flex;gap:7px}
.gastuce{position:absolute;z-index:4;bottom:clamp(12px,2vh,22px);right:clamp(16px,3vw,34px);
  font-size:10.5px;letter-spacing:.18em;color:var(--gris)}

@media (max-width:860px){
  #toile{width:106%;right:-3%;opacity:.4}
  .garde .voile{background:linear-gradient(180deg,rgba(0,0,0,.55),var(--noir) 78%)}
  .garde .masse{background:linear-gradient(180deg,transparent 30%,rgba(36,26,18,.85))}
  .gcontenu{max-width:100%;justify-content:flex-end;padding-bottom:clamp(54px,12vh,110px)}
  .gcoin{display:none}
}

/* rideau d'ouverture */
.rideau{position:fixed;inset:0;z-index:95;background:#000;display:grid;place-items:center;padding:24px}
.rideau.parti{animation:lever .9s cubic-bezier(.7,0,.2,1) forwards}
@keyframes lever{to{clip-path:inset(0 0 100% 0);opacity:0;visibility:hidden}}
.phrase{font-family:var(--dis);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;margin:0;
  font-size:clamp(42px,11vw,130px);line-height:.85;color:var(--vif);text-align:center;transform:skewX(-6deg);
  text-shadow:0 0 50px rgba(255,255,255,.18)}
.phrase span{color:var(--phos)}
.sous-phrase{margin:18px 0 0;text-align:center;font-size:11.5px;letter-spacing:.3em;color:var(--gris)}

[data-theme="clair"] .garde .masse{background:linear-gradient(103deg,transparent 30%,rgba(0,0,0,.92) 30.3%,rgba(0,0,0,.6) 66%,transparent 88%)}
[data-theme="clair"] .garde .voile{background:linear-gradient(95deg,var(--noir) 12%,rgba(255,255,255,.7) 34%,transparent 62%)}
[data-theme="clair"] .gitem{color:var(--argent)}
[data-theme="clair"] .gitem:hover,[data-theme="clair"] .gitem.sel{background:#000;color:#FFF}
[data-theme="clair"] .gitem.premier{background:#000;color:#FFF}
[data-theme="clair"] .gitem.premier:hover{background:#FFF;color:#000;box-shadow:inset 0 0 0 1.5px #000}
[data-theme="clair"] .gnom b{-webkit-text-stroke:1.3px #000}
[data-theme="clair"] .rideau{background:#FFF}
[data-theme="clair"] .phrase{color:#000;text-shadow:none}
[data-theme="acier"] .gitem.premier:hover{background:linear-gradient(100deg,var(--vif),var(--phos))}


/* écrans tactiles : la tuile au centre de l'écran s'active seule, comme au survol */
@media (hover:none){
[data-theme="clair"] .carte.focal{background:#000;box-shadow:none}
[data-theme="clair"] .carte.focal h3{color:#FFF}
[data-theme="clair"] .carte.focal p{color:#9A9A9A}
[data-theme="clair"] .carte.focal .n{-webkit-text-stroke-color:#6E6E6E}
[data-theme="clair"] .carte.focal .tag,[data-theme="clair"] .carte.focal .ouvre{color:#FFF}
[data-theme="clair"] .carte.focal .pastille{color:#B4B4B4;border-color:rgba(255,255,255,.3)}
[data-theme="clair"] .carte.focal .pastille.demo{color:#FFF;border-color:rgba(255,255,255,.6)}
[data-theme="clair"] .item.focal{background:linear-gradient(100deg,#E4E4E4,transparent 74%)}
[data-theme="clair"] .lien.focal{background:#000;color:#FFF;border-color:#000}
[data-theme="clair"] .lien.focal span{color:#9A9A9A}
.carte.focal{background:linear-gradient(150deg,var(--terre),#0D0C0B 62%);transform:translateY(-3px);
  animation:gigote .5s steps(1) infinite}
.carte.focal .ouvre{color:var(--phos)}
.item.focal{border-left-color:var(--phos)}
.lien.focal{background:linear-gradient(100deg,var(--terre),transparent 80%);border-color:var(--phos);transform:translateX(5px)}
}
/* écran d'entrée : la tuile choisie et les petites plaques numérotées gigotent */
.gitem.sel,.gitem.premier{animation:gigote .55s steps(1) infinite}
.gitem .cle{animation:gigote .8s steps(1) infinite}
.gitem:nth-child(2) .cle{animation-delay:-.2s}.gitem:nth-child(3) .cle{animation-delay:-.4s}
.gitem:nth-child(4) .cle{animation-delay:-.6s}.gitem:nth-child(5) .cle{animation-delay:-.1s}

/* aperçus : noir et blanc au repos, couleur au survol ou quand la tuile est active */
.carte .apercu{display:block;width:calc(100% + 40px);height:auto;aspect-ratio:16/10;object-fit:cover;
  margin:-20px -20px 14px;filter:grayscale(1) contrast(1.06);transition:filter .3s}
.carte:hover .apercu,.carte.focal .apercu,.carte:focus-visible .apercu{filter:none}
.carte.avec-img .tag{top:12px;right:14px;z-index:2;background:var(--noir);color:var(--vif);padding:3px 8px}
.carte.avec-img:hover .tag,.carte.avec-img.focal .tag,[data-theme="clair"] .carte.avec-img:hover .tag,[data-theme="clair"] .carte.avec-img.focal .tag{color:var(--vif)}
.fiche .fimg{display:block;width:100%;max-width:520px;height:auto;aspect-ratio:16/10;object-fit:cover;margin:0 0 16px}
@media print{.carte .apercu,.fiche .fimg{display:none}}
</style>
</head>
<body>
<canvas id="grain" aria-hidden="true"></canvas>
<div class="bandes" aria-hidden="true"></div>
<div class="trame" aria-hidden="true"></div>
<div class="halo" aria-hidden="true"></div>
<div class="halo b" aria-hidden="true"></div>


<section class="garde" id="garde">
  <div class="masse" aria-hidden="true"></div>
  <div class="biseau" aria-hidden="true"></div>
  <canvas id="toile" aria-label="Portrait en nuage de points"></canvas>

  <div class="goutils">
    <button class="mini actif" id="gFr" type="button">FR</button>
    <button class="mini" id="gEn" type="button">EN</button>

</section>

<div class="rideau" id="rideau">

</div>

<div class="app" id="appli" style="display:none">
  <header class="haut">
    <div class="marque">A<span>—</span>G</div>
    <div class="etat" id="etat">cotonou, bénin</div>

      <button class="mini actif" id="bFr" type="button">FR</button>

<script>
"use strict";

/* =========================================================
   CONTENU — tout se modifie ici. Chaque texte a sa version fr et en.
   ========================================================= */
const GITHUB="https://github.com/LonerFy";

/* ─────────────────────────────────────────────────────────────
   PORTRAITS — nuages de points tirés des photos.
   Quatre caractères en base 36 par point : sa place dans une grille
   de 300 × 380, puis son niveau de clarté de 0 à 3.

/* grain */
(function(){
  const cv=$("#grain"), g=cv&&cv.getContext&&cv.getContext("2d");
  const tu=document.createElement("canvas");tu.width=tu.height=150;
  const tg=tu.getContext&&tu.getContext("2d");
  if(!g||!tg){ if(cv) cv.style.display="none"; return; }   // canvas indisponible : on s'en passe
  const faire=()=>{const d=tg.createImageData(150,150);
    for(let i=0;i<d.data.length;i+=4){const v=170+Math.random()*85;
      d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=Math.random()*26}
    tg.putImageData(d,0,0)};
  const dim=()=>{cv.width=innerWidth;cv.height=innerHeight};
  const peindre=()=>{g.clearRect(0,0,cv.width,cv.height);g.save();
    g.translate(-Math.random()*150,-Math.random()*150);
    g.fillStyle=g.createPattern(tu,"repeat");
    g.fillRect(0,0,cv.width+150,cv.height+150);g.restore()};
  faire();dim();peindre();
  addEventListener("resize",()=>{dim();peindre()},{passive:true});
  setInterval(()=>{ if(E.mouv){faire();peindre()} },130);
})();

function bip(f,d,v){
  if(!E.son) return;
  try{
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    bip.ctx=bip.ctx||new C();
    const o=bip.ctx.createOscillator(),g=bip.ctx.createGain();
    o.type="square";o.frequency.value=f||520;g.gain.value=v||.02;
    o.connect(g);g.connect(bip.ctx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.0001,bip.ctx.currentTime+(d||.06));
    o.stop(bip.ctx.currentTime+(d||.06));
  }catch(e){}
}

/* tactile : la tuile qui passe au centre de l'écran prend l'état « survolé » */
const tactile=!!(window.matchMedia&&matchMedia("(hover: none)").matches);
/* une seule tuile active : celle dont le centre est le plus proche du milieu de l'écran */
let focalRaf=0;
function majFocal(){
  focalRaf=0;
  const sc=$("#scene"), vue=$(".vue.ici"); if(!sc||!vue) return;
  const r=sc.getBoundingClientRect(), mid=r.top+r.height/2;
  let best=null, d0=Infinity;
  vue.querySelectorAll(".carte, .lien, .item").forEach(el=>{
    const b=el.getBoundingClientRect(); if(b.bottom<r.top||b.top>r.bottom) return;
    const d=Math.abs(b.top+b.height/2-mid); if(d<d0){d0=d;best=el}
  });
  $$("#scene .focal").forEach(el=>{ if(el!==best) el.classList.remove("focal") });
  if(best) best.classList.add("focal");
}
function observerFocal(){
  if(!tactile) return;
  if(!focalRaf) focalRaf=requestAnimationFrame(majFocal);
}
if(tactile){
  $("#scene").addEventListener("scroll",observerFocal,{passive:true});
  addEventListener("resize",observerFocal,{passive:true});
}

/* =========================================================
   ÉCRAN DE GARDE — portrait en nuage de points
   ========================================================= */
const GRILLE={w:300,h:380};
const toile=$("#toile"), ptx=toile&&toile.getContext?toile.getContext("2d"):null;
let LW=0,LH=0,zoom=1,ox=0,oy=0,iForme=0;
const grains=[], FORMES=[];
let souris={x:-9999,y:-9999};
const B36="0123456789abcdefghijklmnopqrstuvwxyz";

function decoder(txt){
  const l=[];
  for(let i=0;i+4<=txt.length;i+=4){
    let n=0;
    for(let k=0;k<4;k++) n=n*36+B36.indexOf(txt[i+k]);
    const b=n%4, idx=(n-b)/4;
    l.push({x:idx%GRILLE.w,y:(idx-idx%GRILLE.w)/GRILLE.w,b:b});
  }
  return l;
}
function batir(){
  PORTRAITS.forEach(p=>FORMES.push({cle:p.cle,pts:decoder(p.data)}));
  const n=Math.max.apply(null,FORMES.map(f=>f.pts.length));
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, r=140+Math.random()*320;
    grains.push({x:GRILLE.w/2+Math.cos(a)*r,y:GRILLE.h/2+Math.sin(a)*r,vx:0,vy:0,
                 tx:GRILLE.w/2,ty:GRILLE.h/2,b:1,r:.85+Math.random()*.3,vif:Math.random()<.05});
  }
  viser(0,true);
}
function viser(k,calme){
  if(!FORMES.length) return;
  iForme=((k%FORMES.length)+FORMES.length)%FORMES.length;
  const f=FORMES[iForme];
  grains.forEach((p,i)=>{
    const c=f.pts[i%f.pts.length];
    p.tx=c.x; p.ty=c.y; p.b=c.b;
    if(!calme){ p.vx+=(Math.random()-.5)*9; p.vy+=(Math.random()-.5)*9; }
  });
}
function dimToile(){
  if(!toile) return;
  const r=toile.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
  LW=r.width; LH=r.height;
  toile.width=Math.max(1,Math.round(LW*dpr)); toile.height=Math.max(1,Math.round(LH*dpr));
  if(ptx) ptx.setTransform(dpr,0,0,dpr,0,0);
  zoom=LH*1.16/GRILLE.h;
  if(GRILLE.w*zoom>LW*1.3) zoom=LW*1.3/GRILLE.w;
  ox=LW*.5-GRILLE.w*zoom/2; oy=LH*.02;
}
function tourner(){
  if(!ptx){ return; }
  ptx.clearRect(0,0,LW,LH);
  const clair=document.documentElement.dataset.theme==="clair";
  for(let i=0;i<grains.length;i++){
    const p=grains[i];
    p.vx+=(p.tx-p.x)*.014; p.vy+=(p.ty-p.y)*.014;
    const ex=ox+p.x*zoom, ey=oy+p.y*zoom, dx=ex-souris.x, dy=ey-souris.y, d2=dx*dx+dy*dy;
    if(d2<9000){ const f=(9000-d2)/9000*.9; p.vx+=dx/zoom*f; p.vy+=dy/zoom*f; }
    p.vx*=.885; p.vy*=.885; p.x+=p.vx; p.y+=p.vy;
    const v=Math.min(1,(Math.abs(p.vx)+Math.abs(p.vy))*.75), t=[.26,.5,.78,1][p.b];
    ptx.fillStyle = p.vif
      ? (clair?"rgba(0,0,0,"+(.35+t*.55)+")":"rgba(121,240,168,"+(.45+t*.5)+")")
      : (clair?"rgba(0,0,0,"+(.18+t*.6)+")"
              :"rgba("+Math.round(150+t*95)+","+Math.round(158+t*90)+","+Math.round(166+t*85)+","+(.30+t*.62)+")");
    const s=(.8+t*.95+v*.8)*p.r*Math.max(.7,zoom/1.2);
    ptx.fillRect(ox+p.x*zoom,oy+p.y*zoom,s,s);
  }
  requestAnimationFrame(tourner);
}
if(toile){
  toile.addEventListener("pointermove",e=>{const r=toile.getBoundingClientRect();souris.x=e.clientX-r.left;souris.y=e.clientY-r.top});
  toile.addEventListener("pointerleave",()=>{souris.x=souris.y=-9999});
  toile.addEventListener("click",()=>{viser(iForme+1);bip(700,.05,.02)});
}
setInterval(()=>{ if(!$("#garde").classList.contains("partie")&&E.mouv) viser(iForme+1); },7000);

/* menu de la garde → sections du portfolio */
const CIBLES=[0,2,1,3,4];
let gSel=0;
function rendreGarde(){
  $("#gSur").textContent=t(I.gsur);
  $("#gAstuce").textContent=t(I.gastuce);
  $("#gLieu").textContent=t(I.glieu);
  $("#nProjets").textContent=NB().n;$("#nDemos").textContent=NB().d;
  $("#gProjets").textContent=t(I.gprojets);
  $("#gDemos").textContent=t(I.gdemos);
  $("#gAmb").textContent=t(I.gamb);
  $("#phrase").innerHTML=ech(t(I.phrase))+"<span>.</span>";
  $("#sousPhrase").textContent=t(I.sousPhrase);
  const d=new Date();
  $("#gHeure").textContent=String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0");
  $("#gFr").classList.toggle("actif",E.lg==="fr");
  $("#gEn").classList.toggle("actif",E.lg==="en");
  $("#gmenu").innerHTML=I.entrees.map((e,i)=>
    `<button class="gitem${i===0?" premier":""}${i===gSel?" sel":""}" type="button" data-g="${i}">
       <span class="carre"></span>${ech(t(e))}<span class="cle">0${i+1}</span></button>`).join("");
  [...document.querySelectorAll(".gitem")].forEach(b=>{
    const i=+b.dataset.g;
    b.addEventListener("click",()=>entrer(i));
    b.addEventListener("mouseenter",()=>{choisir(i);bip(900,.03,.012)});
    b.addEventListener("focus",()=>choisir(i));
  });
  choisir(gSel);
}
function choisir(i){
  gSel=i;
  [...document.querySelectorAll(".gitem")].forEach((b,k)=>b.classList.toggle("sel",k===i));
  $("#gleg").textContent=t(I.legs[i]);
}
function entrer(i){
  const tr=$("#transi");
  tr.classList.remove("joue"); void tr.offsetWidth; tr.classList.add("joue");
  bip(300,.12,.03); viser(iForme+1);
  const cible=CIBLES[i];
  setTimeout(()=>{
    $("#garde").classList.add("partie");
    $("#appli").style.display="flex";
    E.i=cible;                                   // pose la vue sans rejouer le balayage
    $$(".tab").forEach((b,k)=>b.classList.toggle("ici",k===cible)); setTimeout(()=>montrerOnglet(cible),30);
    $$(".vue").forEach(v=>v.classList.remove("ici"));
    $("#v-"+SECTIONS[cible]).classList.add("ici");
    $("#scene").scrollTop=0;
    $("#etat").textContent=t(I.sections[SECTIONS[cible]]).toLowerCase()+" — cotonou";
    majHash(); setTimeout(observerFocal,60);
  },E.mouv?340:0);
}
function sortir(){
  const tr=$("#transi");
  tr.classList.remove("joue"); void tr.offsetWidth; tr.classList.add("joue");
  bip(280,.12,.03);
  setTimeout(()=>{ $("#appli").style.display="none"; $("#garde").classList.remove("partie");
                   dimToile(); viser(iForme,true); },E.mouv?340:0);
}
$("#bAccueil").addEventListener("click",sortir);
$("#gFr").addEventListener("click",()=>langue("fr"));
$("#gEn").addEventListener("click",()=>langue("en"));
$("#gTheme").addEventListener("click",tournerTheme);
$("#gMouv").addEventListener("click",()=>mouvement(!E.mouv));
$("#gSon").addEventListener("click",sonner);

addEventListener("keydown",e=>{
  if($("#garde").classList.contains("partie")) return;
  const n=I.entrees.length;
  if(e.key==="ArrowDown"){e.preventDefault();choisir((gSel+1)%n);bip(880,.03,.012)}
  if(e.key==="ArrowUp"){e.preventDefault();choisir((gSel-1+n)%n);bip(880,.03,.012)}
  if(e.key==="Enter"||e.key===" "){e.preventDefault();entrer(gSel)}
  if(/^[1-5]$/.test(e.key)){e.preventDefault();entrer(+e.key-1)}
},true);
addEventListener("resize",dimToile,{passive:true});

/* clavier */
addEventListener("keydown",e=>{
  if(calque.classList.contains("on")){
    if(e.key==="Escape"){e.preventDefault();fermerFiche()}
    return;
  }
  if(e.key==="ArrowDown"||e.key==="ArrowRight"){e.preventDefault();aller(E.i+1)}
  if(e.key==="ArrowUp"||e.key==="ArrowLeft"){e.preventDefault();aller(E.i-1)}
  if(/^[1-5]$/.test(e.key)){e.preventDefault();aller(+e.key-1)}
});

/* ouverture sur une ancre : #projets ou #projets/snake */
function depuisHash(){
  const h=decodeURIComponent(location.hash.replace(/^#/,""));
  if(!h) return;
  const [sec,pj]=h.split("/");
  const i=SECTIONS.indexOf(sec);
  if(i>=0){E.i=i;$$(".tab").forEach((b,k)=>b.classList.toggle("ici",k===i));setTimeout(()=>montrerOnglet(i),30);
    $$(".vue").forEach(v=>v.classList.remove("ici"));$("#v-"+SECTIONS[i]).classList.add("ici")}
  if(pj){
    const k=PROJETS.findIndex(p=>slug(p.nom)===pj);
    if(k>=0){ if(!PROJETS[k].vedette){E.tout=true;rendreGrille()} ouvrirFiche(k); }
  }
}

if(navigator.language&&navigator.language.slice(0,2)==="en") E.lg="en";
mouvement(true);    // animations actives dès l'entrée ; le bouton permet de passer en sobre
theme(2);           // on ouvre en mode clair
langue(E.lg);
/* le lien CV n'apparaît que si cv.pdf est bien publié à côté de la page */
if(location.protocol.startsWith("http")) try{ fetch("cv.pdf",{method:"HEAD",cache:"no-store"}).then(r=>{ if(r.ok){E.cv=true;rendre()} }).catch(()=>{}); }catch(e){}
batir(); dimToile(); if(ptx) tourner();

/* une adresse directe saute la garde ; sinon on ouvre par le rideau */
if(location.hash){
  $("#rideau").style.display="none";
  $("#garde").classList.add("partie");
  $("#appli").style.display="flex";
  depuisHash();
}else{
  const lever=()=>{ $("#rideau").classList.add("parti");
                    setTimeout(()=>{$("#rideau").style.display="none"},1200);
                    dimToile(); viser(0,true); };
  setTimeout(lever,E.mouv?2100:300);
  $("#rideau").addEventListener("click",lever);
}
</script>
